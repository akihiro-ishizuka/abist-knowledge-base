# UI action matrix — surface contract (MCP + API).
# Canonical for tests/mcp/test_matrix_actions_contract.py.
# Screens are logical domains (not NiceGUI/Textual hosts; those were removed).
# Agents: prefer MCP kb-admin (or all). Compat: kb-download/kb-search/kb-visualize.
# REST: abist-kb api serve. Long-running jobs: abist-kb worker run.
screens:
  dashboard:
    label: ダッシュボード
    actions: {}

  sources_batches:
    label: ソース・バッチ
    actions:
      source_add:
        label: ソース追加
        destructive: false
        surfaces: [mcp, api]
      source_edit:
        label: ソース編集
        destructive: false
        surfaces: [mcp, api]
      source_remove:
        label: ソース削除
        destructive: true
        surfaces: [mcp, api]
      source_test_connection:
        label: ソース接続テスト
        destructive: false
        surfaces: [mcp, api]
      batch_add:
        label: バッチ追加
        destructive: false
        surfaces: [mcp, api]
      batch_edit:
        label: バッチ編集
        destructive: false
        surfaces: [mcp, api]
      batch_remove:
        label: バッチ削除
        destructive: true
        surfaces: [mcp, api]
      batch_run:
        label: バッチ実行
        destructive: false
        surfaces: [mcp, api]

  jobs:
    label: ジョブ
    actions:
      job_cancel:
        label: ジョブキャンセル
        destructive: true
        surfaces: [mcp, api]
      job_retry:
        label: ジョブ再試行
        destructive: false
        surfaces: [mcp, api]

  documents:
    label: 文書
    actions:
      document_update_metadata:
        label: 文書メタデータ編集（status/document_type のみ）
        destructive: false
        surfaces: [mcp, api]
      document_delete:
        label: 文書削除
        destructive: true
        surfaces: [mcp, api]

  search:
    label: 検索
    actions:
      search_run:
        label: 検索実行
        destructive: false
        surfaces: [mcp, api]

  chat:
    label: チャット
    actions:
      chat_start:
        label: 会話開始
        destructive: false
        surfaces: [mcp, api]
      chat_ask:
        label: 質問
        destructive: false
        surfaces: [mcp, api]
      chat_history:
        label: 会話履歴
        destructive: false
        surfaces: [mcp, api]

  visualization:
    label: 可視化
    actions:
      visualization_validate:
        label: SceneSpec 検証
        destructive: false
        surfaces: [mcp, api]
      visualization_submit_render:
        label: レンダリング投入
        destructive: false
        surfaces: [mcp, api]
      visualization_deps:
        label: 可視化依存関係診断
        destructive: false
        surfaces: [mcp, api]

  quality:
    label: 品質
    actions:
      quality_run_integrity:
        label: 整合性監査
        destructive: false
        surfaces: [mcp, api]
      quality_run_duplicates:
        label: 重複監査
        destructive: false
        surfaces: [mcp, api]
      quality_run_contradictions:
        label: 矛盾候補監査
        destructive: false
        surfaces: [mcp, api]
      quality_run_backfill_metadata:
        label: メタデータ補完監査（apply=false / dry-run）
        destructive: false
        surfaces: [mcp, api]

  settings:
    label: 設定・診断
    actions: {}
