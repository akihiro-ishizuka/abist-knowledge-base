[project]
name = "abist-kb"
version = "0.1.0"
description = "ABIST Knowledge Base - multi-source knowledge base with CLI, TUI, Web and MCP interfaces"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Proprietary" }

dependencies = [
    "rich>=15.0,<16",
    "typer>=0.27,<0.28",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
]

[project.scripts]
abist-kb = "abist_kb.presentation.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "hypothesis>=6.165,<7",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abist_kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: 実行時間の長いテスト",
    "requires_node: 旧Nodeシステムを必要とするテスト",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["design"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "T20"]

[tool.ruff.lint.per-file-ignores]
"src/abist_kb/presentation/console/*" = ["T20"]
"tests/*" = ["T20"]
